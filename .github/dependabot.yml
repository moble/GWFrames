version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Updates to the CI alone do not need a new release of GWFrames
    commit-message:
      prefix: "[no release]"

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
