name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GSL and FFTW
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev libfftw3-dev

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"

      - name: Build and install
        run: uv sync --no-editable --group docs

      - name: Build documentation
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
