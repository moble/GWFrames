[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "GWFrames"
version = "2.0.1"
description = "Manipulate gravitational waveforms — changing frames, and so on"
readme = "README.md"
authors = [{ name = "Michael Boyle", email = "mob22@cornell.edu" }]
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "extern/spinsfast/COPYING"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  # PyPI has no h5py wheels for Python 3.15, and may never have them; there,
  # h5py must come from elsewhere (such as conda-forge) for the HDF5 functions.
  "h5py>=3.8; python_version < '3.15'",
]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/moble/GWFrames"
Issues = "https://github.com/moble/GWFrames/issues"
Paper = "https://arxiv.org/abs/1302.2919"

[dependency-groups]
dev = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/GWFrames"]
sdist.exclude = [
  ".github",
  "Docs",
  "Notes",
  "scripts",
  "**/*.ipynb",
  "**/*_wrap.cpp",
  "extern/PostNewtonian/Latex",
  "extern/PostNewtonian/Mathematica",
  "extern/PostNewtonian/PNTerms",
  "extern/PostNewtonian/Waveforms",
  "extern/SpacetimeAlgebra/CythonExample",
  "extern/SphericalFunctions/Notes",
  "extern/SphericalFunctions/Quaternions",
  "extern/spinsfast/bin",
  "extern/spinsfast/build",
  "extern/spinsfast/lib",
  "extern/spinsfast/obj",
  "tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.cibuildwheel]
# Free-threaded builds are skipped because the extension relies on the GIL.
skip = ["cp3??t-*", "*-musllinux_*"]
build-verbosity = 1
before-all = "bash {project}/tools/build-dependencies.sh"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
environment = { DEPS_PREFIX = "/opt/gwframes-deps", CMAKE_PREFIX_PATH = "/opt/gwframes-deps", PKG_CONFIG_PATH = "/opt/gwframes-deps/lib/pkgconfig" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", DEPS_PREFIX = "/tmp/gwframes-deps", CMAKE_PREFIX_PATH = "/tmp/gwframes-deps", PKG_CONFIG_PATH = "/tmp/gwframes-deps/lib/pkgconfig" }
